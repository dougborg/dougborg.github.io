version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
    ignore:
      # astro check refuses TypeScript 7 ("astro check does not currently support TypeScript 7.0").
      # Remove this once @astrojs/check supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
